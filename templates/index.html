<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Laundry Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body class="bg-light">
    <div class="container py-4 page">
        <h1 class="text-center mb-4 flex-shrink-0">🧺 Laundry Status</h1>
        <p id="loading" class="text-center" role="status">Loading machines...</p>
        <p id="update-status" class="text-center flex-shrink-0" role="status" aria-live="polite"></p>

        <div id="dashboard" class="gap-4 dashboard" hidden>
            <section class="strip-wrap">
                <div class="strip-header">
                    <h3 class="strip-title">Washers</h3>
                    <p id="washerCount" class="strip-subtitle"></p>
                </div>
                <div id="washers" class="machine-strip" aria-label="Washers"></div>
            </section>

            <section class="strip-wrap">
                <div class="strip-header">
                    <h3 class="strip-title">Dryers</h3>
                    <p id="dryerCount" class="strip-subtitle"></p>
                </div>
                <div id="dryers" class="machine-strip" aria-label="Dryers"></div>
            </section>
        </div>
    </div>

    <script src="{{ url_for('static', filename='dashboard.js') }}" defer></script>
</body>
</html>
